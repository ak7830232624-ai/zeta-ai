<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zeta AI v21</title><script src="https://alwingulla.com/88/tag.min.js" data-zone="291745" async></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}#t{padding:12px;background:#111;border-bottom:1px solid #222;display:flex;gap:10px;align-items:center}#l{width:36px;height:36px;background:linear-gradient(135deg,#8a2be2,#00d4ff);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900}#c{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.b{padding:12px 16px;border-radius:18px;max-width:85%;line-height:1.5}.u{background:#fff;color:#000;align-self:flex-end}.a{background:#1a1a1a;border:1px solid #2a2a2a;align-self:flex-start}#bar{padding:10px;border-top:1px solid #222;display:flex;gap:6px;background:#000}#inp{flex:1;background:#1a1a1a;border:1px solid #333;color:#fff;padding:12px 18px;border-radius:25px;outline:none}#cb{width:42px;height:42px;background:#1a1a1a;border:1px solid #333;border-radius:50%;cursor:pointer;font-size:18px;color:#fff}#prev{display:none;padding:8px;background:#111;border-top:1px solid #222;align-items:center;gap:8px}</style></head><body><div id="t"><div id="l">Z</div><div><div style="font-weight:800">Zeta AI v21 • Camera + Monetag</div><div style="font-size:11px;color:#0f0" id="st">Monetag 291745 ACTIVE • Camera 📷</div></div><button onclick="document.getElementById('set').style.display='flex'" style="margin-left:auto;background:#222;color:#fff;border:1px solid #444;padding:6px 12px;border-radius:20px">⚙️</button></div><div id="c"><div class="b a">🔥 <b>v21 LIVE - Camera + Monetag!</b><br><br>✅ Monetag 291745 ON<br>✅ 📷 Camera ON<br>✅ Gemini 2.0 Flash<br><br>Neeche 📷 dabao → Photo kheecho!</div></div><input type="file" id="cam" accept="image/*" capture="environment" style="display:none"><input type="file" id="gal" accept="image/*" style="display:none"><div id="prev"><img id="pimg" style="width:50px;height:50px;border-radius:8px;object-fit:cover"><span id="ptxt" style="flex:1;font-size:12px;color:#aaa"></span><button onclick="clearImg()" style="background:#3a1a1a;color:#f55;border:1px solid #5a2a2a;padding:4px 10px;border-radius:20px">✕</button></div><div id="bar"><button id="cb" onclick="document.getElementById('cam').click()">📷</button><button id="cb" onclick="document.getElementById('gal').click()">🖼️</button><input id="inp" placeholder="Photo ke saath pucho..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()" style="background:#fff;color:#000;border:none;padding:12px 18px;border-radius:25px;font-weight:800">Send</button></div><div id="set" style="position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:999;padding:16px"><div style="background:#121212;border:1px solid #333;border-radius:16px;padding:20px;max-width:400px;width:100%"><h3>🔑 Key</h3><input id="kinp" placeholder="AQ.Ab8..." style="width:100%;background:#000;border:1px solid #333;color:#0f0;padding:12px;border-radius:8px;margin:10px 0;font-family:monospace"><button onclick="testK()" id="tbtn" style="width:100%;background:#0f0;color:#000;padding:10px;border-radius:8px;border:none;font-weight:800">Test</button><div id="kst" style="margin-top:8px;font-size:12px;color:#ff0"></div><button onclick="document.getElementById('set').style.display='none'" style="width:100%;margin-top:10px;background:#fff;color:#000;padding:10px;border-radius:8px;border:none;font-weight:800">Done</button></div></div><script>
let KEY=localStorage.getItem('zeta_v21_key')||'AQ.Ab8RN6LOJT2fJTMHLMZUyOfmxgvXMEpY1';let MODEL='gemini-2.0-flash';let imgB=null,imgM=null;const MODELS=['gemini-2.0-flash','gemini-1.5-flash'];
function handle(f){if(!f)return;let r=new FileReader();r.onload=e=>{imgB=e.target.result.split(',')[1];imgM=f.type;document.getElementById('pimg').src=e.target.result;document.getElementById('ptxt').textContent=f.name;document.getElementById('prev').style.display='flex'};r.readAsDataURL(f)}
document.getElementById('cam').addEventListener('change',e=>handle(e.target.files[0]));document.getElementById('gal').addEventListener('change',e=>handle(e.target.files[0]));function clearImg(){imgB=null;imgM=null;document.getElementById('prev').style.display='none'}
async function testK(){let k=document.getElementById('kinp').value.trim();if(k.length<20)return;localStorage.setItem('zeta_v21_key',k);KEY=k;document.getElementById('kst').textContent='Testing...';for(let m of MODELS){try{let r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${k}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'Hi'}]}]})});let d=await r.json();if(d.candidates){MODEL=m;document.getElementById('kst').textContent='✓ '+m;document.getElementById('st').textContent=m+' ACTIVE';document.getElementById('set').style.display='none';return}}catch(e){}}document.getElementById('kst').textContent='Fail';}
async function callAI(p){for(let m of [MODEL,...MODELS]){try{let parts=imgB?[{text:p},{inline_data:{mime_type:imgM||'image/jpeg',data:imgB}}]:[{text:p}];let r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:parts}],generationConfig:{temperature:0.8}})});let d=await r.json();if(d.candidates?.[0]?.content?.parts?.[0]?.text)return d.candidates[0].content.parts[0].text}catch(e){}}throw new Error('Fail');}
async function send(){let i=document.getElementById('inp');let t=i.value.trim();if(!t&&!imgB)return;let c=document.getElementById('c');let h='';if(imgB)h+=`<img src="data:${imgM};base64,${imgB}" style="max-width:200px;border-radius:12px;display:block;margin-bottom:6px">`;h+=t.replace(/</g,'&lt;');c.innerHTML+=`<div class="b u">${h}</div>`;let curB=imgB;i.value='';clearImg();let a=document.createElement('div');a.className='b a';a.textContent='⏳ Dekh raha hu...';c.appendChild(a);c.scrollTop=9999;try{let ans=await callAI(t||'Is photo me kya hai?');a.innerHTML=ans.replace(/</g,'&lt;').replace(/\n/g,'<br>')}catch(e){a.textContent='❌ '+e.message}c.scrollTop=9999}
window.onload=()=>{document.getElementById('kinp').value=KEY;if(KEY.length>30)testK()}
</script></body></html>
